<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄闹钟</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  user-select: none;
  -webkit-user-select: none;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 30px;
  padding: 40px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 30px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  position: relative;
}

/* 设置按钮 */
.settings-btn {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border: none;
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.settings-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
.settings-btn.active { background: rgba(255, 255, 255, 0.2); color: #fff; }

/* 设置面板 */
.settings-panel {
  display: none;
  flex-direction: column;
  gap: 14px;
  width: 100%;
  max-width: 280px;
  padding: 20px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.settings-panel.show { display: flex; }

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.setting-row label {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.7);
  white-space: nowrap;
}
.setting-row input[type="range"] {
  flex: 1;
  accent-color: #e74c3c;
  height: 4px;
}
.setting-row .val {
  font-size: 13px;
  color: #e74c3c;
  font-weight: 700;
  min-width: 42px;
  text-align: right;
}

/* 历史统计 */
.stats-row {
  display: flex;
  gap: 20px;
  justify-content: center;
}
.stat-item {
  text-align: center;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  min-width: 70px;
}
.stat-item .num {
  font-size: 28px;
  font-weight: 700;
  color: #e74c3c;
}
.stat-item .unit {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
  margin-top: 2px;
}

/* 进度环 */
.timer-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
}

.progress-ring {
  transform: rotate(-90deg);
  width: 300px;
  height: 300px;
}

.progress-ring .bg {
  fill: none;
  stroke: rgba(255, 255, 255, 0.1);
  stroke-width: 8;
}

.progress-ring .fill {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s linear, stroke 0.4s;
}

.progress-ring .fill.work {
  stroke: #e74c3c;
}

.progress-ring .fill.break {
  stroke: #2ecc71;
}

.progress-ring .fill.long-break {
  stroke: #3498db;
}

.timer-display {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.time {
  font-size: 64px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 4px;
  font-variant-numeric: tabular-nums;
}

.mode-label {
  font-size: 16px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.7);
  margin-top: 6px;
  letter-spacing: 2px;
}

.session-indicator {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 10px;
}
.session-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transition: background 0.3s;
}
.session-dot.done { background: #e74c3c; }
.session-dot.current { background: rgba(231, 76, 60, 0.5); }

.counter {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.5);
  text-align: center;
}

.counter span {
  color: #e74c3c;
  font-weight: 700;
  font-size: 18px;
}

.buttons {
  display: flex;
  gap: 14px;
}

.btn {
  padding: 12px 32px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.25s;
  outline: none;
}

.btn:active {
  transform: scale(0.95);
}

.btn-start {
  background: #e74c3c;
  color: #fff;
  box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
}

.btn-start:hover {
  background: #c0392b;
  box-shadow: 0 8px 25px rgba(231, 76, 60, 0.5);
}

.btn-pause {
  background: #f39c12;
  color: #fff;
  box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
}

.btn-pause:hover {
  background: #e67e22;
  box-shadow: 0 8px 25px rgba(243, 156, 18, 0.5);
}

.btn-reset {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

.btn-reset:hover {
  background: rgba(255, 255, 255, 0.25);
}
</style>
</head>
<body>
<div class="container">
  <button class="settings-btn" id="btnSettings" title="设置">⚙</button>

  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <label>工作时长</label>
      <input type="range" id="workDuration" min="5" max="60" value="25" step="5">
      <span class="val" id="workVal">25分</span>
    </div>
    <div class="setting-row">
      <label>短休息</label>
      <input type="range" id="breakDuration" min="1" max="30" value="5" step="1">
      <span class="val" id="breakVal">5分</span>
    </div>
    <div class="setting-row">
      <label>长休息</label>
      <input type="range" id="longBreakDuration" min="10" max="45" value="20" step="5">
      <span class="val" id="longBreakVal">20分</span>
    </div>
    <div class="setting-row">
      <label>长休息间隔</label>
      <input type="range" id="longBreakInterval" min="2" max="6" value="4" step="1">
      <span class="val" id="longBreakIntervalVal">4个🍅</span>
    </div>
  </div>

  <div class="timer-wrapper">
    <svg class="progress-ring" viewBox="0 0 300 300">
      <circle class="bg" cx="150" cy="150" r="136"/>
      <circle class="fill work" id="progressCircle" cx="150" cy="150" r="136"
              stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display">
      <div class="time" id="timeDisplay">25:00</div>
      <div class="mode-label" id="modeLabel">工作中</div>
      <div class="session-indicator" id="sessionDots"></div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-item">
      <div class="num" id="statToday">0</div>
      <div class="unit">今日</div>
    </div>
    <div class="stat-item">
      <div class="num" id="statWeek">0</div>
      <div class="unit">本周</div>
    </div>
    <div class="stat-item">
      <div class="num" id="statTotal">0</div>
      <div class="unit">总计</div>
    </div>
  </div>

  <div class="counter">今日完成 <span id="pomoCount">0</span> 个番茄</div>

  <div class="buttons">
    <button class="btn btn-start" id="btnStart">开始</button>
    <button class="btn btn-reset" id="btnReset">重置</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'pomodoro_settings';
const HISTORY_KEY = 'pomodoro_history';
const CIRCUMFERENCE = 2 * Math.PI * 136;

const MODE = { WORK: 'work', BREAK: 'break', LONG_BREAK: 'long-break' };
const SOUND_NOTES = [880, 660, 990];

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { workMin: 25, breakMin: 5, longBreakMin: 20, longBreakInterval: 4 };
}

function saveSettings(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

function saveHistory(h) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}

function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getWeekKey() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.setDate(diff));
  return mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0');
}

function calcStats(history) {
  const todayKey = getTodayKey();
  const weekKey = getWeekKey();
  let today = 0;
  let week = 0;
  let total = history.length;
  for (const entry of history) {
    if (entry.date === todayKey) today++;
    if (entry.date >= weekKey) week++;
  }
  return { today, week, total };
}

class PomodoroTimer {
  constructor() {
    this.settings = loadSettings();
    this.history = loadHistory();
    this.mode = MODE.WORK;
    this.remainingSeconds = this.settings.workMin * 60;
    this.intervalId = null;
    this.sessionPomoCount = 0;
    this.audioCtx = null;

    this.timeDisplay = document.getElementById('timeDisplay');
    this.modeLabel = document.getElementById('modeLabel');
    this.progressCircle = document.getElementById('progressCircle');
    this.btnStart = document.getElementById('btnStart');
    this.btnReset = document.getElementById('btnReset');
    this.pomoCountEl = document.getElementById('pomoCount');
    this.btnSettings = document.getElementById('btnSettings');
    this.settingsPanel = document.getElementById('settingsPanel');
    this.sessionDots = document.getElementById('sessionDots');

    this.progressCircle.setAttribute('stroke-dasharray', CIRCUMFERENCE);

    this.btnStart.addEventListener('click', () => this.toggleStart());
    this.btnReset.addEventListener('click', () => this.reset());
    this.btnSettings.addEventListener('click', () => this.toggleSettings());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.intervalId) this.pause();
    });

    this.bindSettingsInputs();
    this.render();
    this.renderMode();
    this.renderSessionDots();
    this.updateStats();
  }

  get totalSeconds() {
    if (this.mode === MODE.LONG_BREAK) return this.settings.longBreakMin * 60;
    if (this.mode === MODE.BREAK) return this.settings.breakMin * 60;
    return this.settings.workMin * 60;
  }

  formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  render() {
    this.timeDisplay.textContent = this.formatTime(this.remainingSeconds);
    this.progressCircle.style.strokeDashoffset =
      CIRCUMFERENCE * (1 - this.remainingSeconds / this.totalSeconds);
  }

  renderMode() {
    let cls = this.mode;
    if (cls === MODE.LONG_BREAK) cls = 'long-break';
    this.progressCircle.className.baseVal = 'fill ' + cls;

    if (this.mode === MODE.WORK) this.modeLabel.textContent = '工作中';
    else if (this.mode === MODE.LONG_BREAK) this.modeLabel.textContent = '长休息';
    else this.modeLabel.textContent = '休息中';
  }

  renderSessionDots() {
    const interval = this.settings.longBreakInterval;
    let html = '';
    for (let i = 0; i < interval; i++) {
      let cls = 'session-dot';
      if (i < this.sessionPomoCount) cls += ' done';
      else if (i === this.sessionPomoCount) cls += ' current';
      html += '<div class="' + cls + '"></div>';
    }
    this.sessionDots.innerHTML = html;
  }

  updateStats() {
    const stats = calcStats(this.history);
    document.getElementById('statToday').textContent = stats.today;
    document.getElementById('statWeek').textContent = stats.week;
    document.getElementById('statTotal').textContent = stats.total;
    this.pomoCountEl.textContent = stats.today;
  }

  setButtonState(text, className) {
    this.btnStart.textContent = text;
    this.btnStart.className = className;
  }

  toggleStart() {
    if (this.intervalId) { this.pause(); } else { this.start(); }
  }

  start() {
    this.intervalId = setInterval(() => this.tick(), 1000);
    this.setButtonState('暂停', 'btn btn-pause');
  }

  pause() {
    clearInterval(this.intervalId);
    this.intervalId = null;
    this.setButtonState('继续', 'btn btn-start');
  }

  reset() {
    this.pause();
    this.mode = MODE.WORK;
    this.remainingSeconds = this.settings.workMin * 60;
    this.setButtonState('开始', 'btn btn-start');
    this.render();
    this.renderMode();
  }

  tick() {
    this.remainingSeconds--;
    this.render();

    if (this.remainingSeconds <= 0) {
      this.pause();
      this.playSound();
      this.switchMode();
    }
  }

  switchMode() {
    if (this.mode === MODE.WORK) {
      this.sessionPomoCount++;
      this.recordPomodoro();

      if (this.sessionPomoCount >= this.settings.longBreakInterval) {
        this.mode = MODE.LONG_BREAK;
        this.sessionPomoCount = 0;
      } else {
        this.mode = MODE.BREAK;
      }
    } else {
      this.mode = MODE.WORK;
    }
    this.remainingSeconds = this.totalSeconds;
    this.setButtonState('开始', 'btn btn-start');
    this.render();
    this.renderMode();
    this.renderSessionDots();
    this.updateStats();
  }

  recordPomodoro() {
    const today = getTodayKey();
    this.history.push({ date: today, ts: Date.now() });
    const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    this.history = this.history.filter(e => e.ts > cutoff);
    saveHistory(this.history);
  }

  playSound() {
    try {
      if (!this.audioCtx) {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = this.audioCtx;
      ctx.resume();

      const notes = this.mode === MODE.LONG_BREAK ? SOUND_NOTES.concat([660, 880, 1100]) : SOUND_NOTES;
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.2);
        osc.stop(ctx.currentTime + i * 0.2 + 0.3);
        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      });
    } catch (e) {}
  }

  toggleSettings() {
    this.settingsPanel.classList.toggle('show');
    this.btnSettings.classList.toggle('active');
  }

  bindSettingsInputs() {
    const ids = ['workDuration', 'breakDuration', 'longBreakDuration', 'longBreakInterval'];
    const valIds = ['workVal', 'breakVal', 'longBreakVal', 'longBreakIntervalVal'];
    const suffixes = ['分', '分', '分', '个🍅'];
    const keys = ['workMin', 'breakMin', 'longBreakMin', 'longBreakInterval'];

    ids.forEach((id, i) => {
      const input = document.getElementById(id);
      const valEl = document.getElementById(valIds[i]);
      input.value = this.settings[keys[i]];
      valEl.textContent = input.value + suffixes[i];

      input.addEventListener('input', () => {
        valEl.textContent = input.value + suffixes[i];
        this.settings[keys[i]] = parseInt(input.value);
        saveSettings(this.settings);

        this.remainingSeconds = this.totalSeconds;
        this.pause();
        this.setButtonState('开始', 'btn btn-start');
        this.render();
        this.renderMode();
        this.renderSessionDots();
      });
    });
  }
}

new PomodoroTimer();
</script>
</body>
</html>
