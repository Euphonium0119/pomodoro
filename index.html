<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄闹钟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #ff5e5b;
    --red-glow: rgba(255, 94, 91, 0.35);
    --green: #4ecb71;
    --green-glow: rgba(78, 203, 113, 0.3);
    --blue: #5b9bd5;
    --blue-glow: rgba(91, 155, 213, 0.3);
    --orange: #f0a050;
    --orange-glow: rgba(240, 160, 80, 0.3);
    --bg-deep: #0d1117;
    --surface: rgba(255, 255, 255, 0.04);
    --surface-hover: rgba(255, 255, 255, 0.07);
    --text-primary: #f0f0f0;
    --text-secondary: rgba(255, 255, 255, 0.5);
    --border-subtle: rgba(255, 255, 255, 0.06);
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: var(--bg-deep);
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  /* 背景动态光斑 */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
    transition: all 2s ease;
  }
  .bg-orb.orb1 { width: 500px; height: 500px; background: var(--red); top: -15%; left: -10%; }
  .bg-orb.orb2 { width: 400px; height: 400px; background: #6366f1; bottom: -12%; right: -8%; }

  body.break-mode .bg-orb.orb1 { background: var(--green); opacity: 0.1; }
  body.break-mode .bg-orb.orb2 { background: #34d399; opacity: 0.08; }
  body.long-break-mode .bg-orb.orb1 { background: var(--blue); opacity: 0.12; }
  body.long-break-mode .bg-orb.orb2 { background: #818cf8; opacity: 0.1; }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 48px 44px 40px;
    background: var(--surface);
    border-radius: 32px;
    border: 1px solid var(--border-subtle);
    box-shadow:
      0 4px 24px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.03);
    position: relative;
    z-index: 1;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: border-color 0.6s;
  }

  /* 顶部 header */
  .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* 设置按钮 */
  .settings-btn {
    width: 38px;
    height: 38px;
    border: 1px solid var(--border-subtle);
    background: var(--surface-hover);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .settings-btn svg {
    width: 18px;
    height: 18px;
    color: var(--text-secondary);
    transition: transform 0.5s;
  }
  .settings-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.12); }
  .settings-btn:hover svg { color: var(--text-primary); }
  .settings-btn.active svg { transform: rotate(90deg); color: var(--text-primary); }

  /* 设置面板 - 抽屉式 */
  .settings-panel {
    width: 100%;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.3s, margin 0.3s;
    opacity: 0;
    margin-top: -12px;
  }
  .settings-panel.show {
    max-height: 300px;
    opacity: 1;
    margin-top: 0;
  }
  .settings-inner {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 20px;
    background: var(--surface-hover);
    border-radius: 16px;
    border: 1px solid var(--border-subtle);
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .setting-row label {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-weight: 500;
  }
  .setting-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
    cursor: pointer;
  }
  .setting-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--red);
    border: 2px solid #fff;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--red-glow);
    transition: transform 0.15s;
  }
  .setting-row input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }
  .setting-row .val {
    font-size: 13px;
    color: var(--red);
    font-weight: 700;
    min-width: 40px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* 进度环 */
  .timer-wrapper {
    position: relative;
    width: 280px;
    height: 280px;
  }
  .progress-ring {
    transform: rotate(-90deg);
    width: 280px;
    height: 280px;
    filter: drop-shadow(0 0 20px var(--red-glow));
    transition: filter 0.6s;
  }
  .progress-ring .bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.06);
    stroke-width: 6;
  }
  .progress-ring .fill {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear, stroke 0.4s, filter 0.6s;
  }
  .progress-ring .fill.work { stroke: var(--red); }
  .progress-ring .fill.break { stroke: var(--green); }
  .progress-ring .fill.long-break { stroke: var(--blue); }

  /* 模式切换时进度环发光变化 */
  body.break-mode .progress-ring { filter: drop-shadow(0 0 16px var(--green-glow)); }
  body.long-break-mode .progress-ring { filter: drop-shadow(0 0 16px var(--blue-glow)); }

  .timer-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .time {
    font-family: 'JetBrains Mono', 'Consolas', monospace;
    font-size: 58px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 20px rgba(255, 255, 255, 0.15);
  }
  .time.pulse {
    animation: timePulse 0.5s ease;
  }
  @keyframes timePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .mode-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-top: 4px;
    letter-spacing: 3px;
    transition: color 0.4s;
  }

  .session-indicator {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
  }
  .session-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    transition: all 0.4s;
  }
  .session-dot.done {
    background: var(--red);
    box-shadow: 0 0 8px var(--red-glow);
  }
  .session-dot.current {
    background: rgba(255, 94, 91, 0.4);
    animation: dotPulse 1.5s ease infinite;
  }
  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--red-glow); }
    50% { box-shadow: 0 0 0 6px transparent; }
  }

  /* 统计 */
  .stats-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    width: 100%;
  }
  .stat-item {
    text-align: center;
    padding: 12px 18px;
    background: var(--surface-hover);
    border-radius: 14px;
    border: 1px solid var(--border-subtle);
    flex: 1;
    max-width: 90px;
    transition: border-color 0.3s, background 0.3s;
  }
  .stat-item:hover { border-color: rgba(255, 255, 255, 0.12); }
  .stat-item .num {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
    transition: color 0.4s;
  }
  .stat-item .unit {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
    letter-spacing: 1px;
  }

  /* 按钮 */
  .buttons {
    display: flex;
    gap: 12px;
  }
  .btn {
    padding: 13px 36px;
    border: none;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.3s;
    outline: none;
    font-family: 'Noto Sans SC', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(0.96); }
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 50%);
    pointer-events: none;
    border-radius: 16px;
  }

  .btn-start {
    background: var(--red);
    color: #fff;
    box-shadow: 0 4px 20px var(--red-glow);
  }
  .btn-start:hover {
    background: #ff6b68;
    box-shadow: 0 6px 28px rgba(255, 94, 91, 0.45);
    transform: translateY(-1px);
  }

  .btn-pause {
    background: var(--orange);
    color: #fff;
    box-shadow: 0 4px 20px var(--orange-glow);
  }
  .btn-pause:hover {
    background: #f5a85a;
    box-shadow: 0 6px 28px rgba(240, 160, 80, 0.45);
    transform: translateY(-1px);
  }

  .btn-reset {
    background: rgba(255, 255, 255, 0.06);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
  }
  .btn-reset:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.15);
  }

  /* Toast 完成提示 */
  .toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: rgba(20, 20, 20, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    padding: 14px 28px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    z-index: 100;
    backdrop-filter: blur(20px);
    pointer-events: none;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast .icon { margin-right: 8px; }

  /* 响应式 */
  .noise-select {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    color: var(--text-primary);
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    outline: none;
    flex: 1;
    transition: border-color 0.3s;
  }
  .noise-select:hover, .noise-select:focus {
    border-color: rgba(255, 255, 255, 0.15);
  }
  .noise-select option {
    background: #1a1a2e;
    color: #fff;
  }

  @media (max-width: 480px) {
    .container { padding: 32px 24px 30px; gap: 18px; border-radius: 24px; }
    .timer-wrapper { width: 220px; height: 220px; }
    .progress-ring { width: 220px; height: 220px; }
    .time { font-size: 44px; }
    .btn { padding: 12px 28px; font-size: 14px; }
    .stat-item { padding: 8px 12px; }
    .stat-item .num { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="container">
  <div class="header">
    <span class="title">POMODORO</span>
    <button class="settings-btn" id="btnSettings" title="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-inner">
      <div class="setting-row">
        <label>工作时长</label>
        <input type="range" id="workDuration" min="5" max="60" value="25" step="5">
        <span class="val" id="workVal">25分</span>
      </div>
      <div class="setting-row">
        <label>短休息</label>
        <input type="range" id="breakDuration" min="1" max="30" value="5" step="1">
        <span class="val" id="breakVal">5分</span>
      </div>
      <div class="setting-row">
        <label>长休息</label>
        <input type="range" id="longBreakDuration" min="10" max="45" value="20" step="5">
        <span class="val" id="longBreakVal">20分</span>
      </div>
      <div class="setting-row">
        <label>长休息间隔</label>
        <input type="range" id="longBreakInterval" min="2" max="6" value="4" step="1">
        <span class="val" id="longBreakIntervalVal">4个🍅</span>
      </div>
      <div class="setting-row">
        <label>白噪音</label>
        <select id="noiseType" class="noise-select">
          <option value="off">关闭</option>
          <option value="rain">🌧️ 雨声</option>
          <option value="wind">🌬️ 风声</option>
          <option value="campfire">🔥 篝火声</option>
        </select>
      </div>
      <div class="setting-row">
        <label>音量</label>
        <input type="range" id="noiseVolume" min="10" max="100" value="40" step="5">
        <span class="val" id="noiseVolumeVal">40%</span>
      </div>
    </div>
  </div>

  <div class="timer-wrapper">
    <svg class="progress-ring" viewBox="0 0 280 280">
      <circle class="bg" cx="140" cy="140" r="132"/>
      <circle class="fill work" id="progressCircle" cx="140" cy="140" r="132"
              stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display">
      <div class="time" id="timeDisplay">25:00</div>
      <div class="mode-label" id="modeLabel">工作中</div>
      <div class="session-indicator" id="sessionDots"></div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-item">
      <div class="num" id="statToday">0</div>
      <div class="unit">今日</div>
    </div>
    <div class="stat-item">
      <div class="num" id="statWeek">0</div>
      <div class="unit">本周</div>
    </div>
    <div class="stat-item">
      <div class="num" id="statTotal">0</div>
      <div class="unit">总计</div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-start" id="btnStart">开始</button>
    <button class="btn btn-reset" id="btnReset">重置</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'pomodoro_settings';
const HISTORY_KEY = 'pomodoro_history';
const CIRCUMFERENCE = 2 * Math.PI * 132;

const MODE = { WORK: 'work', BREAK: 'break', LONG_BREAK: 'long-break' };
const SOUND_NOTES = [880, 660, 990];

function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { workMin: 25, breakMin: 5, longBreakMin: 20, longBreakInterval: 4, noiseType: 'off', noiseVolume: 40 };
}

function saveSettings(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}

function saveHistory(h) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
}

function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getWeekKey() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.setDate(diff));
  return mon.getFullYear() + '-' + String(mon.getMonth() + 1).padStart(2, '0') + '-' + String(mon.getDate()).padStart(2, '0');
}

function calcStats(history) {
  const todayKey = getTodayKey();
  const weekKey = getWeekKey();
  let today = 0;
  let week = 0;
  let total = history.length;
  for (const entry of history) {
    if (entry.date === todayKey) today++;
    if (entry.date >= weekKey) week++;
  }
  return { today, week, total };
}

class WhiteNoiseEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.nodes = [];
    this.running = false;
    this.rainDropInterval = null;
    this.crackleInterval = null;
  }

  async start(type, volume) {
    this.stop();
    if (type === 'off') return;
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    await this.ctx.resume();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = volume;
    this.masterGain.connect(this.ctx.destination);
    this.running = true;

    if (type === 'rain') this._startRain();
    else if (type === 'wind') this._startWind();
    else if (type === 'campfire') this._startCampfire();
  }

  stop() {
    this.running = false;
    if (this.rainDropInterval) { clearInterval(this.rainDropInterval); this.rainDropInterval = null; }
    if (this.crackleInterval) { clearInterval(this.crackleInterval); this.crackleInterval = null; }
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, this.ctx.currentTime);
      this.masterGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
      setTimeout(() => {
        this.nodes.forEach(n => { try { n.disconnect(); } catch(e) {} });
        this.nodes = [];
        if (this.masterGain) { try { this.masterGain.disconnect(); } catch(e) {}; this.masterGain = null; }
      }, 200);
    }
  }

  _createNoise(duration) {
    const size = this.ctx.sampleRate * duration;
    const buf = new AudioBuffer({ length: size, sampleRate: this.ctx.sampleRate });
    const data = buf.getChannelData(0);
    for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    return src;
  }

  _startRain() {
    const ctx = this.ctx;
    const noise = this._createNoise(1);
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 4000;
    noise.connect(lowpass);
    lowpass.connect(this.masterGain);
    noise.start();
    this.nodes.push(noise, lowpass);

    this.rainDropInterval = setInterval(() => {
      if (!this.running) return;
      const drop = this._createNoise(0.03);
      const dropFilt = ctx.createBiquadFilter();
      dropFilt.type = 'bandpass';
      dropFilt.frequency.value = 600 + Math.random() * 1400;
      dropFilt.Q.value = 0.5;
      const eg = ctx.createGain();
      eg.gain.setValueAtTime(0.6 + Math.random() * 0.4, ctx.currentTime);
      eg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08 + Math.random() * 0.06);
      drop.connect(dropFilt);
      dropFilt.connect(eg);
      eg.connect(this.masterGain);
      drop.start();
      drop.stop(ctx.currentTime + 0.15);
      drop.onended = () => { drop.disconnect(); dropFilt.disconnect(); eg.disconnect(); };
    }, 50 + Math.random() * 40);
  }

  _startWind() {
    const ctx = this.ctx;
    const noise = this._createNoise(2);
    const lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass';
    lowpass.frequency.value = 600;

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.15;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 300;
    lfo.connect(lfoGain);
    lfoGain.connect(lowpass.frequency);
    lfo.start();
    noise.connect(lowpass);
    lowpass.connect(this.masterGain);
    noise.start();
    this.nodes.push(noise, lowpass, lfo, lfoGain);
  }

  _startCampfire() {
    const ctx = this.ctx;
    const baseNoise = this._createNoise(1);
    const baseFilt = ctx.createBiquadFilter();
    baseFilt.type = 'lowpass';
    baseFilt.frequency.value = 800;
    baseNoise.connect(baseFilt);
    baseFilt.connect(this.masterGain);
    baseNoise.start();
    this.nodes.push(baseNoise, baseFilt);

    this.crackleInterval = setInterval(() => {
      if (!this.running) return;
      const crack = this._createNoise(0.02 + Math.random() * 0.04);
      const crackFilt = ctx.createBiquadFilter();
      crackFilt.type = 'bandpass';
      crackFilt.frequency.value = 200 + Math.random() * 2000;
      const crackEg = ctx.createGain();
      crackEg.gain.setValueAtTime(0.3 + Math.random() * 0.7, ctx.currentTime);
      crackEg.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03 + Math.random() * 0.05);
      crack.connect(crackFilt);
      crackFilt.connect(crackEg);
      crackEg.connect(this.masterGain);
      crack.start();
      crack.stop(ctx.currentTime + 0.1);
      crack.onended = () => { crack.disconnect(); crackFilt.disconnect(); crackEg.disconnect(); };
    }, 30 + Math.random() * 200);
  }
}

class PomodoroTimer {
  constructor() {
    this.settings = loadSettings();
    this.history = loadHistory();
    this.mode = MODE.WORK;
    this.remainingSeconds = this.settings.workMin * 60;
    this.intervalId = null;
    this.sessionPomoCount = 0;
    this.audioCtx = null;
    this.noiseEngine = new WhiteNoiseEngine();

    this.timeDisplay = document.getElementById('timeDisplay');
    this.modeLabel = document.getElementById('modeLabel');
    this.progressCircle = document.getElementById('progressCircle');
    this.btnStart = document.getElementById('btnStart');
    this.btnReset = document.getElementById('btnReset');
    this.btnSettings = document.getElementById('btnSettings');
    this.settingsPanel = document.getElementById('settingsPanel');
    this.sessionDots = document.getElementById('sessionDots');
    this.toast = document.getElementById('toast');
    this.toastTimer = null;

    this.progressCircle.setAttribute('stroke-dasharray', CIRCUMFERENCE);
    this.progressCircle.setAttribute('stroke-dashoffset', '0');

    this.btnStart.addEventListener('click', () => this.toggleStart());
    this.btnReset.addEventListener('click', () => this.reset());
    this.btnSettings.addEventListener('click', () => this.toggleSettings());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.intervalId) this.pause();
    });

    this.bindSettingsInputs();
    this.bindNoiseSettings();
    this.render();
    this.renderMode();
    this.renderSessionDots();
    this.updateStats();
  }

  get totalSeconds() {
    if (this.mode === MODE.LONG_BREAK) return this.settings.longBreakMin * 60;
    if (this.mode === MODE.BREAK) return this.settings.breakMin * 60;
    return this.settings.workMin * 60;
  }

  formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  render() {
    this.timeDisplay.textContent = this.formatTime(this.remainingSeconds);
    this.progressCircle.style.strokeDashoffset =
      CIRCUMFERENCE * (1 - this.remainingSeconds / this.totalSeconds);
  }

  renderMode() {
    let cls = this.mode;
    if (cls === MODE.LONG_BREAK) cls = 'long-break';
    this.progressCircle.className.baseVal = 'fill ' + cls;

    document.body.classList.remove('break-mode', 'long-break-mode');
    if (this.mode === MODE.BREAK) document.body.classList.add('break-mode');
    if (this.mode === MODE.LONG_BREAK) document.body.classList.add('long-break-mode');

    if (this.mode === MODE.WORK) this.modeLabel.textContent = '工作中';
    else if (this.mode === MODE.LONG_BREAK) this.modeLabel.textContent = '长休息';
    else this.modeLabel.textContent = '休息中';
  }

  renderSessionDots() {
    const interval = this.settings.longBreakInterval;
    let html = '';
    for (let i = 0; i < interval; i++) {
      let cls = 'session-dot';
      if (i < this.sessionPomoCount) cls += ' done';
      else if (i === this.sessionPomoCount) cls += ' current';
      html += '<div class="' + cls + '"></div>';
    }
    this.sessionDots.innerHTML = html;
  }

  updateStats() {
    const stats = calcStats(this.history);
    document.getElementById('statToday').textContent = stats.today;
    document.getElementById('statWeek').textContent = stats.week;
    document.getElementById('statTotal').textContent = stats.total;
  }

  setButtonState(text, className) {
    this.btnStart.textContent = text;
    this.btnStart.className = className;
  }

  toggleStart() {
    if (this.intervalId) { this.pause(); } else { this.start(); }
  }

  start() {
    this.intervalId = setInterval(() => this.tick(), 1000);
    this.setButtonState('暂停', 'btn btn-pause');
    const noiseType = document.getElementById('noiseType').value;
    const noiseVol = parseInt(document.getElementById('noiseVolume').value) / 100;
    this.noiseEngine.start(noiseType, noiseVol);
  }

  pause() {
    clearInterval(this.intervalId);
    this.intervalId = null;
    this.setButtonState('继续', 'btn btn-start');
    this.noiseEngine.stop();
  }

  reset() {
    this.pause();
    this.noiseEngine.stop();
    this.mode = MODE.WORK;
    this.remainingSeconds = this.settings.workMin * 60;
    this.setButtonState('开始', 'btn btn-start');
    document.body.classList.remove('break-mode', 'long-break-mode');
    this.render();
    this.renderMode();
  }

  tick() {
    this.remainingSeconds--;
    this.render();

    if (this.remainingSeconds <= 0) {
      this.pause();
      this.playSound();
      this.timeDisplay.classList.add('pulse');
      setTimeout(() => this.timeDisplay.classList.remove('pulse'), 500);
      this.switchMode();
    }
  }

  switchMode() {
    this.noiseEngine.stop();
    if (this.mode === MODE.WORK) {
      this.sessionPomoCount++;
      this.recordPomodoro();

      if (this.sessionPomoCount >= this.settings.longBreakInterval) {
        this.mode = MODE.LONG_BREAK;
        this.sessionPomoCount = 0;
        this.showToast('🎉', '太棒了！来段长休息吧~');
      } else {
        this.mode = MODE.BREAK;
        this.showToast('🍅', '完成一个番茄！休息一下~');
      }
    } else {
      this.mode = MODE.WORK;
      this.showToast('▶', '休息结束，继续加油！');
    }
    this.remainingSeconds = this.totalSeconds;
    this.setButtonState('开始', 'btn btn-start');
    this.render();
    this.renderMode();
    this.renderSessionDots();
    this.updateStats();
  }

  showToast(icon, msg) {
    if (this.toastTimer) clearTimeout(this.toastTimer);
    this.toast.innerHTML = '<span class="icon">' + icon + '</span>' + msg;
    this.toast.classList.add('show');
    this.toastTimer = setTimeout(() => this.toast.classList.remove('show'), 2200);
  }

  recordPomodoro() {
    const today = getTodayKey();
    this.history.push({ date: today, ts: Date.now() });
    const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    this.history = this.history.filter(e => e.ts > cutoff);
    saveHistory(this.history);
  }

  playSound() {
    try {
      if (!this.audioCtx) {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = this.audioCtx;
      ctx.resume();

      const notes = this.mode === MODE.LONG_BREAK ? SOUND_NOTES.concat([660, 880, 1100]) : SOUND_NOTES;
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.2 + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.2);
        osc.stop(ctx.currentTime + i * 0.2 + 0.3);
        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      });
    } catch (e) {}
  }

  toggleSettings() {
    this.settingsPanel.classList.toggle('show');
    this.btnSettings.classList.toggle('active');
  }

  bindSettingsInputs() {
    const ids = ['workDuration', 'breakDuration', 'longBreakDuration', 'longBreakInterval'];
    const valIds = ['workVal', 'breakVal', 'longBreakVal', 'longBreakIntervalVal'];
    const suffixes = ['分', '分', '分', '个🍅'];
    const keys = ['workMin', 'breakMin', 'longBreakMin', 'longBreakInterval'];

    ids.forEach((id, i) => {
      const input = document.getElementById(id);
      const valEl = document.getElementById(valIds[i]);
      input.value = this.settings[keys[i]];
      valEl.textContent = input.value + suffixes[i];

      input.addEventListener('input', () => {
        valEl.textContent = input.value + suffixes[i];
        this.settings[keys[i]] = parseInt(input.value);
        saveSettings(this.settings);

        this.remainingSeconds = this.totalSeconds;
        this.pause();
        this.setButtonState('开始', 'btn btn-start');
        this.render();
        this.renderMode();
        this.renderSessionDots();
      });
    });
  }

  bindNoiseSettings() {
    const noiseTypeEl = document.getElementById('noiseType');
    const noiseVolInput = document.getElementById('noiseVolume');
    const noiseVolVal = document.getElementById('noiseVolumeVal');

    noiseTypeEl.value = this.settings.noiseType || 'off';
    noiseVolInput.value = this.settings.noiseVolume || 40;
    noiseVolVal.textContent = noiseVolInput.value + '%';

    noiseTypeEl.addEventListener('change', () => {
      this.settings.noiseType = noiseTypeEl.value;
      saveSettings(this.settings);
    });
    noiseVolInput.addEventListener('input', () => {
      noiseVolVal.textContent = noiseVolInput.value + '%';
      this.settings.noiseVolume = parseInt(noiseVolInput.value);
      saveSettings(this.settings);
    });
  }
}

new PomodoroTimer();
</script>
</body>
</html>
